name: Windows build

# Builds the playable Windows x64 version of VoxelRacing and uploads it as a
# downloadable portable artifact (extract and run VoxelRacing.exe; no Godot
# install needed). Adapted from the SirensWentQuiet Windows build workflow.
# Runs on pushes to the working branches and by hand from the Actions tab.
on:
  push:
    branches:
      - "claude/**"
      - "main"
  workflow_dispatch:

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"
  GODOT_RELEASE: "4.7.2-stable"

jobs:
  export-windows:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Cache Godot and export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-${{ env.GODOT_RELEASE }}-windows

      - name: Download Godot and the Windows export template
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}"
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip "${base}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          unzip -q -o /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_RELEASE}_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot
          curl -fsSL -o /tmp/templates.tpz "${base}/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$dest"
          unzip -q -o -j /tmp/templates.tpz "templates/version.txt" "templates/windows_release_x86_64.exe" "templates/windows_debug_x86_64.exe" -d "$dest"
          ls -la "$dest"

      - name: Import the project
        run: ~/godot/godot --headless --path . --import || true

      - name: Export for Windows
        run: |
          set -euo pipefail
          mkdir -p build/windows
          ~/godot/godot --headless --path . --export-release "Windows Desktop" build/windows/VoxelRacing.exe
          test -s build/windows/VoxelRacing.exe
          mkdir -p build/windows/custom/graphics build/windows/custom/audio
          cp tools/windows/README.txt build/windows/README.txt
          ls -la build/windows

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: VoxelRacing-windows-x64-${{ github.sha }}
          path: build/windows/
          retention-days: 30
